server {
  listen 80;
  server_name localhost;
  client_max_body_size 2m;

  # 文本压缩：公网入口由宿主机 nginx 终止 TLS，这里同时开启，
  # 使直连 127.0.0.1:8080 的调试与未压缩上游代理也能受益。
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  # 图片与静态文件数量多，减少重复 stat 开销
  open_file_cache max=2000 inactive=60s;
  open_file_cache_valid 120s;
  open_file_cache_min_uses 1;

  location ^~ /previews/ { return 404; }
  location ^~ /design/ { return 404; }

  # 构建产物带内容哈希：可以永久缓存
  location ~* ^/assets/[^/]+-[A-Za-z0-9_-]+\.(?:js|css)$ {
    root /usr/share/nginx/html;
    add_header X-Zhixing-Version "0.3.0" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # 稳定文件名的图片：给足缓存，避免每次访问重下整张插画
  location /assets/ {
    root /usr/share/nginx/html;
    add_header X-Zhixing-Version "0.3.0" always;
    add_header Cache-Control "public, max-age=2592000" always;
  }

  # 入口 HTML 必须保持可重新验证，否则新版本发不出去
  location = /index.html {
    root /usr/share/nginx/html;
    add_header X-Zhixing-Version "0.3.0" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  location /api/ {
    add_header X-Zhixing-Version "0.3.0" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    proxy_pass http://api:8765;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 310s;
    proxy_buffering off;
  }

  location = /api/videos/uploads {
    client_max_body_size 128m;
    proxy_request_buffering off;
    proxy_pass http://api:8765;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    add_header Cache-Control "no-store" always;
  }

  # SPA 回退
  location / {
    root /usr/share/nginx/html;
    add_header X-Zhixing-Version "0.3.0" always;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
