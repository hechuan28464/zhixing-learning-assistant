services:
  web:
    build: {context: ../../.., dockerfile: app/deploy/server/Dockerfile, target: web}
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  api:
    build: {context: ../../.., dockerfile: app/deploy/server/Dockerfile, target: api}
    env_file: .env.server
    environment:
      STUDY_DB_PATH: /data/learning.sqlite3
      STUDY_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      STUDY_PBL_RUNNER_URL: http://runner:8890
    volumes: ["learning-data:/data"]
    depends_on: [runner]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 6
  runner:
    build: {context: ../../.., dockerfile: app/deploy/pbl-runner/Dockerfile}
    environment:
      STUDY_PBL_RUNNER_TOKEN: ${STUDY_PBL_RUNNER_TOKEN:?Run prepare.py first}
      PBL_RUNNER_IMAGE: ${PBL_RUNNER_IMAGE:-python:3.12-slim}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    restart: unless-stopped
    mem_limit: 512m
volumes:
  learning-data:
